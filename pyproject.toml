[project]
name = "system-one"
version = "0.1.0"
description = "Reproducible experiments for fraud decision models."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3",
    "pydantic>=2.0,<3",
    "pyyaml>=6.0,<7",
    "scikit-learn>=1.6,<2",
]

[project.scripts]
system-one = "system_one.cli:main"

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
