# Preparation example; these settings have not been validated by a Clef adapter.
schema_version: 1

experiment:
  name: emscad_clef_flash_supervised
  training_seeds: [42, 43, 44]

dataset:
  adapter: emscad
  version: null
  split_seed: 2026
  split_manifest: null
  evidence_template: job_posting_v1

model:
  adapter: clef
  checkpoint: Cloudflare/clef-flash
  revision: null
  max_length: 512

training:
  objective: cross_entropy
  strategy: head_only
  epochs: 4
  batch_size: 1
  gradient_accumulation_steps: 64
  learning_rate: 0.0001
  weight_decay: 0.0

calibration:
  method: temperature_scaling

evaluation:
  selection_metric: average_precision
  review_budget_fraction: 0.05

runtime:
  device: cuda
  precision: bfloat16
  deterministic: true
